<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthConnect Pro</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f9ff;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen">
        <!-- Navigation -->
        <nav class="gradient-bg text-white p-4">
            <div class="container mx-auto flex justify-between items-center">
                <div class="text-2xl font-bold">HealthConnect Pro</div>
                <div class="flex space-x-4">
                    <button @click="switchLanguage" class="hover:text-sky-200">
                        <i class="bi bi-translate"></i> {{currentLanguage}}
                    </button>
                    <button @click="showEmergency = true" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-full">
                        Emergency
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="container mx-auto p-4">
            <!-- Quick Actions -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div @click="startVoiceAssistant" class="glass-effect p-6 rounded-xl shadow-lg cursor-pointer hover:shadow-xl transition-all">
                    <i class="bi bi-mic-fill text-4xl text-sky-600"></i>
                    <h3 class="text-xl font-semibold mt-4">Voice Assistant</h3>
                    <p class="text-gray-600">Get help with voice commands</p>
                </div>
                <div @click="showAppointment = true" class="glass-effect p-6 rounded-xl shadow-lg cursor-pointer hover:shadow-xl transition-all">
                    <i class="bi bi-calendar2-plus text-4xl text-sky-600"></i>
                    <h3 class="text-xl font-semibold mt-4">Book Appointment</h3>
                    <p class="text-gray-600">Schedule a consultation</p>
                </div>
                <div @click="startVideoCall" class="glass-effect p-6 rounded-xl shadow-lg cursor-pointer hover:shadow-xl transition-all">
                    <i class="bi bi-camera-video-fill text-4xl text-sky-600"></i>
                    <h3 class="text-xl font-semibold mt-4">Video Consultation</h3>
                    <p class="text-gray-600">Connect with doctor now</p>
                </div>
            </div>

            <!-- Appointment Modal -->
            <div v-if="showAppointment" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
                <div class="glass-effect rounded-xl p-6 max-w-md w-full">
                    <h2 class="text-2xl font-bold mb-4">Book Appointment</h2>
                    <form @submit.prevent="bookAppointment">
                        <div class="space-y-4">
                            <input type="text" v-model="appointmentForm.name" placeholder="Full Name" class="w-full p-2 border rounded" required>
                            <input type="email" v-model="appointmentForm.email" placeholder="Email" class="w-full p-2 border rounded" required>
                            <input type="tel" v-model="appointmentForm.phone" placeholder="Phone" class="w-full p-2 border rounded" required>
                            <input type="date" v-model="appointmentForm.date" class="w-full p-2 border rounded" required>
                            <select v-model="appointmentForm.time" class="w-full p-2 border rounded" required>
                                <option value="">Select Time</option>
                                <option v-for="time in availableTimes" :value="time">{{time}}</option>
                            </select>
                        </div>
                        <div class="mt-6 flex space-x-4">
                            <button type="submit" class="gradient-bg text-white px-6 py-2 rounded-full">Book Now</button>
                            <button type="button" @click="showAppointment = false" class="bg-gray-200 px-6 py-2 rounded-full">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Emergency Modal -->
            <div v-if="showEmergency" class="fixed inset-0 bg-red-500 bg-opacity-20 flex items-center justify-center p-4">
                <div class="glass-effect rounded-xl p-6 max-w-md w-full">
                    <h2 class="text-2xl font-bold mb-4 text-red-600">Emergency Support</h2>
                    <div class="space-y-4">
                        <button @click="startEmergencyCall" class="w-full bg-red-600 text-white p-4 rounded-xl flex items-center justify-center space-x-2">
                            <i class="bi bi-telephone-fill"></i>
                            <span>Call Emergency Support</span>
                        </button>
                        <button @click="sendEmergencyLocation" class="w-full bg-red-500 text-white p-4 rounded-xl flex items-center justify-center space-x-2">
                            <i class="bi bi-geo-alt-fill"></i>
                            <span>Share Location</span>
                        </button>
                        <button @click="showEmergency = false" class="w-full bg-gray-200 p-4 rounded-xl">Cancel</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    currentLanguage: 'English',
                    showAppointment: false,
                    showEmergency: false,
                    appointmentForm: {
                        name: '',
                        email: '',
                        phone: '',
                        date: '',
                        time: ''
                    },
                    availableTimes: [
                        '09:00 AM', '10:00 AM', '11:00 AM',
                        '02:00 PM', '03:00 PM', '04:00 PM'
                    ],
                    languages: ['English', 'Español', 'Français', '中文']
                }
            },
            methods: {
                switchLanguage() {
                    const currentIndex = this.languages.indexOf(this.currentLanguage)
                    const nextIndex = (currentIndex + 1) % this.languages.length
                    this.currentLanguage = this.languages[nextIndex]
                    // In real implementation, this would trigger language change in the backend
                },
                startVoiceAssistant() {
                    if ('webkitSpeechRecognition' in window) {
                        alert('Voice assistant activated! Please speak.')
                        // In real implementation, this would connect to Dialogflow
                    } else {
                        alert('Voice recognition not supported in your browser')
                    }
                },
                startVideoCall() {
                    alert('Initiating video call... Please wait for doctor to connect.')
                    // In real implementation, this would integrate with a video calling service
                },
                bookAppointment() {
                    alert('Appointment booked successfully! You will receive an SMS confirmation.')
                    this.showAppointment = false
                    // In real implementation, this would submit to the backend
                },
                startEmergencyCall() {
                    window.location.href = 'tel:911'
                },
                sendEmergencyLocation() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition((position) => {
                            alert('Location shared with emergency services!')
                            // In real implementation, this would send coordinates to emergency services
                        })
                    }
                }
            }
        }).mount('#app')
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
